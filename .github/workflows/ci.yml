name: CI

on:
  push:
    branches: [development, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (kiwi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi
    services:
      db:
        image: pgvector/pgvector:0.7.2-pg16
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kiwi"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2.5-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://kiwi:kiwi@localhost:5432/kiwi
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: kiwi/.nvmrc
          cache: npm
          cache-dependency-path: kiwi/package-lock.json
      - run: npm ci || npm install
      - run: npx prisma generate
      - run: npm run build
      # Unit tests are not yet gating: the suite has pre-existing failures and
      # leaves handles open, so it is run with a timeout and does not fail CI.
      # Re-enable as a gate once those are fixed - see the TODO in CONTRIBUTING.md.
      - name: Unit tests (non-gating)
        continue-on-error: true
        timeout-minutes: 10
        run: npm test -- --ci --forceExit

  frontend:
    name: frontend (kiwi-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: kiwi-ui/.nvmrc
          cache: npm
          cache-dependency-path: kiwi-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      # Not yet gating - see the backend job's note and CONTRIBUTING.md.
      - name: Unit tests (non-gating)
        continue-on-error: true
        run: npm run test:run

  sdk:
    name: app sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi-app-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiwi-app-sdk/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      # The single-file build is vendored into two consumers; they must not drift.
      - name: Vendored SDK copies are in sync
        working-directory: .
        run: |
          diff kiwi-app-sdk/dist/kiwi-app-sdk.global.js kiwi-ui/public/sdk/v1/kiwi-app-sdk.js
          diff kiwi-app-sdk/dist/kiwi-app-sdk.global.js \
               kiwi-app-developer-guide-example/kiwi-app-sdk/kiwi-app-sdk.js
