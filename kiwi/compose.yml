services:
  db:
    image: pgvector/pgvector:0.7.2-pg16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwi
      POSTGRES_DB: kiwi
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432

  redis:
    image: redis:7.2.5-alpine
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    command: 'redis-server --save 20 1 --loglevel warning'
    volumes:
      - redis-data:/data

  adminer: # Dev only
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8081:8080

  # Document parser used by uploads (PARSER=xberg in .env). To use
  # Unstructured instead, uncomment the service at the end of this list and set
  # PARSER=unstructured, UNSTRUCTURED_API_URL=http://localhost:9500.
  xberg:
    # Pinned: the models baked into the image are version-specific, so an
    # unpinned upgrade can change extraction output. 1.2.3 is also a floor:
    # annotation highlights need `pdf_page_coordinate_frames`.
    image: ghcr.io/xberg-io/xberg:${XBERG_VERSION:-1.2.3}
    # The entrypoint is `tini -- xberg`, so this is just the subcommand.
    command: ['serve', '-H', '0.0.0.0', '-p', '8000']
    environment:
      # Xberg sizes its concurrency from the host's core count, not the
      # container's CPU quota, and each extraction loads ONNX models, so an
      # unbounded value runs out of memory. Keep in step with XBERG_CPUS.
      XBERG_MAX_CONCURRENT_REQUESTS: ${XBERG_MAX_CONCURRENT:-4}
      # Must stay below Kiwi's client timeout (XBERG_EXTRACTION_TIMEOUT_SECS + 30s).
      XBERG_JOB_TIMEOUT_SECS: ${XBERG_JOB_TIMEOUT_SECS:-1200}
      # Kiwi always posts bytes; the `uri` input is a local-file-read/SSRF surface.
      XBERG_API_ALLOW_LOCAL_URI_INPUTS: 'false'
      XBERG_NATIVE_PDF_MAX_DECOMPRESS_MB: ${XBERG_MAX_DECOMPRESS_MB:-512}
      XBERG_CORS_ORIGINS: ${XBERG_CORS_ORIGINS:-http://localhost:3000}
      # Both apply: the first caps the request, the second the file part.
      XBERG_MAX_REQUEST_BODY_BYTES: ${XBERG_MAX_REQUEST_BODY_BYTES:-209715200}
      XBERG_MAX_MULTIPART_FIELD_BYTES: ${XBERG_MAX_MULTIPART_FIELD_BYTES:-209715200}
      RUST_LOG: ${XBERG_LOG_LEVEL:-info}
      XBERG_CACHE_DIR: /app/.xberg
      HF_HOME: /app/.xberg/huggingface
    # The API has no authentication of any kind. Keep it on loopback; never
    # publish it or put it behind a public proxy.
    ports:
      - 127.0.0.1:${XBERG_PORT:-8002}:8000
    volumes:
      # Must stay a named volume: Docker seeds it from the ~1 GB of models baked
      # into the image. A bind mount would hide them and force a re-download.
      - xberg-cache:/app/.xberg
    # Extractions run for minutes; the 10s default would kill them.
    stop_grace_period: ${XBERG_STOP_GRACE:-120s}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Inference is CPU-bound; cap it so parsing cannot starve the API.
    deploy:
      resources:
        limits:
          cpus: '${XBERG_CPUS:-4}'
          memory: ${XBERG_MEMORY:-6g}


  oss: # Dev only, use S3 in production
    image: rustfs/rustfs:1.0.0
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: kiwi
      RUSTFS_SECRET_KEY: kiwikiwi
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs-data:/data
    ports:
      - 127.0.0.1:9000:9000 # Endpoint
      - 127.0.0.1:9001:9001 # Console
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  oss-init:
    image: amazon/aws-cli:2.34.0
    restart: 'no'
    depends_on:
      oss:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: kiwi
      AWS_SECRET_ACCESS_KEY: kiwikiwi
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        aws --endpoint-url http://oss:9000 s3api head-bucket --bucket kiwi 2>/dev/null ||
          aws --endpoint-url http://oss:9000 s3api create-bucket --bucket kiwi
        # The frontend loads files from signed URLs on another origin; RustFS
        # (unlike MinIO) sends no CORS headers without a bucket policy.
        aws --endpoint-url http://oss:9000 s3api put-bucket-cors --bucket kiwi \
          --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["Content-Range","Accept-Ranges","Content-Length","Content-Type","Content-Disposition","ETag","Last-Modified"],"MaxAgeSeconds":3600}]}'

  # Unstructured, the alternative document parser (a large image).
  # unstructured:
  #   image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.71
  #   restart: always
  #   environment:
  #     PORT: 9500
  #   ports:
  #     - 127.0.0.1:9500:9500

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
  xberg-cache:
    driver: local
